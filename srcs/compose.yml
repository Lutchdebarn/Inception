services:
  mariadb:
    container_name: mariadb
    networks:
      - inception
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    expose:
      - "3306"

  nginx:
    container_name: nginx
    networks:
      - inception
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: unless-stopped

  wordpress:
    container_name: wordpress
    networks:
      - inception
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "9000"

volumes:
  db_data
networks:
  inception


#Ce qui reste à corriger
# Les deux sections du bas ne sont pas du YAML valide. db_data et inception ont toujours besoin de deux-points. Pour que db_data écrive dans /home/ludebarn/data/mariadb, il lui faut en dessous driver: local et driver_opts: avec trois clés : type: none, o: bind et device: suivi du chemin.
# Le volume WordPress n'existe toujours pas. Il doit être déclaré en bas, comme db_data, avec son propre chemin. Puis il doit apparaître dans la liste volumes: de WordPress et de nginx, au même chemin /var/www/html.
# Les dossiers doivent exister avant le lancement : /home/ludebarn/data/mariadb et /home/ludebarn/data/wordpress, sinon le bind échoue.
